[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soloheaven"
version = "0.1.0"
description = "OpenAI-compatible chat server for Qwen3.5-class models"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [
    { name = "fai" },
]
keywords = ["qwen", "llm", "openai-compatible", "proxy", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.104",
    "httpx>=0.27",
    "uvicorn[standard]>=0.24",
    "aiosqlite>=0.19",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
soloheaven = "mlx_soloheaven.cli:main"

[project.urls]
Homepage = "https://github.com/joongom/mlx-soloheaven"
Repository = "https://github.com/joongom/mlx-soloheaven"

[tool.hatch.build.targets.wheel]
packages = ["src/mlx_soloheaven"]

[tool.ruff]
target-version = "py311"
line-length = 100
